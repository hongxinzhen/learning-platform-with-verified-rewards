<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>墨芽 · 同模型缩略图导出</title><style>body{margin:0;background:#182d26;color:#d9dabf;font:12px system-ui}iframe{display:block;width:360px;height:360px;border:0;margin:0}p{padding:10px;margin:0}</style><iframe id="render" title="模型缩略图制作视图"></iframe><p id="name"></p><script>const q=new URLSearchParams(location.search),key=q.get('item')||'small';document.querySelector('#name').textContent=key+' · 正在渲染';window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==document.querySelector('#render').contentWindow)return;if(e.data?.type==='moya:item-ready')document.querySelector('#name').textContent=key+' · 已就绪';if(e.data?.type==='moya:item-error')document.querySelector('#name').textContent=key+' · '+e.data.message});document.querySelector('#render').src='/item-viewer/index.html?thumbnail=1&item='+encodeURIComponent(key)+'&tier='+encodeURIComponent(q.get('tier')||'wood');</script></html>
